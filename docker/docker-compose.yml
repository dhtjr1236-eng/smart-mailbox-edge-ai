version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: mailbox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailbox
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mailbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mailbox_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mailbox
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
