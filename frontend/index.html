<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📬 Smart Mailbox Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Smart Mailbox"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="17"/><line x1="9" y1="14.5" x2="15" y2="14.5"/></svg>
        <span>Smart Mailbox</span>
      </div>
      <nav>
        <button class="nav-btn active" id="btn-all">전체</button>
        <button class="nav-btn" id="btn-detected">감지만</button>
      </nav>
      <button class="theme-toggle" data-theme-toggle aria-label="테마 전환">🌙</button>
    </div>
  </header>
  <main>
    <section class="stats-bar">
      <div class="stat-card"><span class="stat-label">전체 기록</span><span class="stat-value" id="total-count">-</span></div>
      <div class="stat-card detected"><span class="stat-label">우편물 감지</span><span class="stat-value" id="detected-count">-</span></div>
      <div class="stat-card"><span class="stat-label">오늘</span><span class="stat-value" id="today-count">-</span></div>
    </section>
    <section class="controls">
      <input type="date" id="date-filter" />
      <button class="btn-refresh" id="btn-refresh">🔄 새로고침</button>
    </section>
    <section class="records-grid" id="records-grid">
      <div class="loading">데이터 불러오는 중...</div>
    </section>
    <div class="pagination">
      <button id="btn-prev" disabled>이전</button>
      <span id="page-info">1 페이지</span>
      <button id="btn-next">다음</button>
    </div>
  </main>
  <div class="modal" id="image-modal">
    <div class="modal-inner">
      <button class="modal-close">✕</button>
      <img id="modal-img" src="" alt="감지 이미지" />
      <p id="modal-image-fallback" hidden>📷 이미지를 불러올 수 없습니다.</p>
      <p id="modal-desc"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
